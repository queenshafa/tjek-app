name: klock_app
description: "Student attendance with Riverpod and Firebase."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  intl: ^0.20.3
  camera: ^0.12.2
  image: ^4.13.1
  shared_preferences: ^2.5.6

  material_ui: any
  google_fonts: ^9.0.0
  one_clock: ^2.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true
  assets:
    - assets/brand/tjek.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/tjek.png"
  adaptive_icon_background: "#0B0B0B"
  adaptive_icon_foreground: "assets/brand/tjek.png"


